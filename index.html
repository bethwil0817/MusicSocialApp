<!doctype html><script>// Single Page Apps for GitHub Pages
	// https://github.com
	(function (l) {
		if (l.search[1] === "/") {
			var decoded = l.search
				.slice(1)
				.split("&")
				.map(function (s) {
					return s.replace(/~and~/g, "&");
				})
				.join("?");
			window.history.replaceState(
				null,
				null,
				l.pathname.slice(0, -1) + decoded + l.hash,
			);
		}
	})(window.location);</script><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Document</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Blinker:wght@400;600;700;800;900&family=Funnel+Display:wght@300..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik+80s+Fade&family=Ruluko&display=swap" rel="stylesheet"/><script defer="defer" src="./bundle.js"></script></head><body><div id="root"></div></body></html>
